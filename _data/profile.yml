short_bio_text_justify: false
short_bio: >-
  <p>
  Junwei is currently a Ph.D. Candidate in the Zachry Department of Civil and Environmental Engineering at Texas A&M University. 
  He works under the supervision of Prof. Ali Mostafavi at the  <a href="https://www.urbanresilience.ai/" target="_blank">Urban Resilience.AI Lab</a>.
  </p>
  <p>
    Junwei's research centers around four interconnected themes: 
    <strong><em>Urban Resilience</em></strong>, <strong><em>Urban Systems</em></strong>, <strong><em>Urban Intelligence</em></strong>, and <strong><em>Urban Crises</em></strong> (4U).
  </p>
  <p>
    His research goal is to create new knowledge and methods in integrated intelligence to deliver transformative solutions 
    that enhance resiliency, accessibility, inclusivity, sustainability, and equity (<strong><em>RAISE</em></strong>) in urban environments under ever-changing climate conditions. 
  </p>

